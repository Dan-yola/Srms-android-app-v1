name: Build SRMS Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Get your project from GitHub
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install Android SDK 34
      - name: Install Android SDK 34
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      # 5. Make Gradle executable
      - name: Make Gradle executable
        working-directory: srms-android-app
        run: chmod +x gradlew

      # 6. Build your actual SRMS app
      - name: Build Debug APK
        working-directory: srms-android-app
        run: ./gradlew clean assembleDebug

      # 7. Upload the APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SRMS-debug-APK
          path: srms-android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
